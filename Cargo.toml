[package]
name = "linkbench"
version = "0.2.0"
edition = "2024"
description = "Developer workbench for serial, TCP, UDP, Modbus, MQTT and REST (English and German)"
repository = "https://github.com/johmarjac/LinkBench"

[dependencies]
eframe = { version = "0.37", features = ["persistence"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serialport = { version = "4.10", default-features = false }
serde = { version = "1", features = ["derive"] }
rfd = "0.18.0"
chrono = "0.4.45"
mlua = { version = "0.12.2", features = ["lua54", "vendored"] }
ureq = "3.5.2"
serde_json = "1.0.154"
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider"] }
sys-locale = "0.3.2"

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# Linux .deb package (built by the release workflow with cargo-deb)
[package.metadata.deb]
name = "linkbench"
maintainer = "LinkBench <noreply@github.com>"
section = "devel"
priority = "optional"
extended-description = """\
Serial ports, TCP client, TCP server, UDP, Modbus, MQTT and REST in one window. \
Text or hex display, send lines, loops, Lua scripts, ASCII table \
and checksum tools. Interface in English and German."""
depends = "$auto"
assets = [
    ["target/release/linkbench", "usr/bin/", "755"],
    ["packaging/linux/linkbench.desktop", "usr/share/applications/", "644"],
    ["packaging/linux/linkbench-mime.xml", "usr/share/mime/packages/linkbench.xml", "644"],
    ["README.md", "usr/share/doc/linkbench/README.md", "644"],
]
