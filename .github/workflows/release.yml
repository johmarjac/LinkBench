# Builds LinkBench for every platform and publishes a GitHub release.
#
# Start it by hand: GitHub → Actions → "Release" → "Run workflow",
# enter a version like 0.2.0. Or push a tag such as v0.2.0.
# If that version already exists, tick "Vorhandene Version ersetzen":
# the old release and its tag are removed right before the new one is published.
#
# Result per release:
#   Windows x64   LinkBench-<v>-windows-x64.msi            (installer)
#                 LinkBench-<v>-windows-x64-portable.exe   (no install needed)
#   macOS         LinkBench-<v>-macos-universal.dmg        (Intel + Apple Silicon)
#                 LinkBench-<v>-macos-universal.zip        (the .app)
#   Linux x64     LinkBench-<v>-linux-x64.deb / .tar.gz
#   Linux ARM64   LinkBench-<v>-linux-arm64.deb / .tar.gz

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (z. B. 0.2.0) – wird als Tag v0.2.0 angelegt"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release / Als Vorabversion markieren"
        type: boolean
        default: false
      draft:
        description: "Draft only, not public yet / Nur als Entwurf anlegen"
        type: boolean
        default: false
      replace:
        description: "Replace existing version (deletes the old release and tag) / Vorhandene Version ersetzen"
        type: boolean
        default: false
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Version festlegen
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version muss die Form 1.2.3 haben (bekommen: '$VERSION')"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"
      - name: Gibt es die Version schon?
        if: github.event_name == 'workflow_dispatch' && !inputs.replace
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.v.outputs.version }}"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Version $TAG already exists. Choose a new version number or tick 'Replace existing version' (Vorhandene Version ersetzen)."
            exit 1
          fi

  windows:
    name: Windows x64 (MSI + portabel)
    needs: prepare
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Version eintragen
        shell: bash
        run: perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{VERSION}"/m' Cargo.toml
      - name: Bauen
        run: cargo build --release
      - name: Portable EXE
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/linkbench.exe "dist/LinkBench-$VERSION-windows-x64-portable.exe"
      - name: WiX installieren
        run: dotnet tool install --global wix --version 5.0.2
      - name: MSI bauen
        shell: pwsh
        run: |
          wix build -arch x64 `
            -d Version=$env:VERSION `
            -d BinPath="$PWD\target\release\linkbench.exe" `
            packaging\windows\LinkBench.wxs `
            -o "dist\LinkBench-$env:VERSION-windows-x64.msi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item dist\*.wixpdb -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS (Universal)
    needs: prepare
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Version eintragen
        run: perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{VERSION}"/m' Cargo.toml
      - name: Bauen (Apple Silicon + Intel)
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
      - name: App-Paket und DMG
        run: |
          APP="dist/LinkBench.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create \
            target/aarch64-apple-darwin/release/linkbench \
            target/x86_64-apple-darwin/release/linkbench \
            -output "$APP/Contents/MacOS/LinkBench"
          chmod +x "$APP/Contents/MacOS/LinkBench"
          sed "s/__VERSION__/$VERSION/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          codesign --force --deep --sign - "$APP"
          (cd dist && ditto -c -k --keepParent LinkBench.app "LinkBench-$VERSION-macos-universal.zip")
          mkdir -p dmg
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Programme
          hdiutil create -volname "LinkBench $VERSION" -srcfolder dmg -ov -format UDZO \
            "dist/LinkBench-$VERSION-macos-universal.dmg"
          rm -rf "$APP"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }} (.deb + .tar.gz)
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Systempakete
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - name: Version eintragen
        run: perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{VERSION}"/m' Cargo.toml
      - name: Bauen
        run: cargo build --release
      - name: Pakete
        run: |
          mkdir -p dist
          cargo deb --no-build --output "dist/LinkBench-$VERSION-linux-${{ matrix.arch }}.deb"
          mkdir -p "pkg/LinkBench-$VERSION"
          cp target/release/linkbench packaging/linux/linkbench.desktop README.md "pkg/LinkBench-$VERSION/"
          tar -C pkg -czf "dist/LinkBench-$VERSION-linux-${{ matrix.arch }}.tar.gz" "LinkBench-$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [prepare, windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Remove old version
        if: github.event_name == 'workflow_dispatch' && inputs.replace
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" || true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          ls -l
      - name: Release page text
        env:
          V: ${{ needs.prepare.outputs.version }}
        run: |
          {
            echo "## Downloads"
            echo
            echo "| System | File |"
            echo "|---|---|"
            echo "| Windows (Installer) | \`LinkBench-$V-windows-x64.msi\` |"
            echo "| Windows (portable, no installation) | \`LinkBench-$V-windows-x64-portable.exe\` |"
            echo "| macOS (Intel + Apple Silicon) | \`LinkBench-$V-macos-universal.dmg\` |"
            echo "| Linux (Debian/Ubuntu) | \`LinkBench-$V-linux-x64.deb\` / \`-arm64.deb\` |"
            echo "| Linux (other) | \`LinkBench-$V-linux-x64.tar.gz\` / \`-arm64.tar.gz\` |"
            echo
            echo "macOS: the app is not notarized by Apple. Start it the first time with right-click → Open."
            echo
            # the section "## [V]" of CHANGELOG.md, up to the next "## ["
            if [ -f CHANGELOG.md ]; then
              awk -v v="## [$V]" 'index($0, v) == 1 { on = 1; print "## New in this version"; next } /^## \[/ { on = 0 } on' CHANGELOG.md
            fi
          } > release-body.md
          cat release-body.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: LinkBench ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease || false }}
          draft: ${{ inputs.draft || false }}
          generate_release_notes: false
          fail_on_unmatched_files: true
          body_path: release-body.md
          files: dist/*
